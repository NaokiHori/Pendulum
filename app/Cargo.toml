[package]
name = "pendulum"
version = "0.1.0"
edition = "2021"
authors = ["Naoki Hori"]
description = "Energy-conserving N-body pendulum simulator"
repository = "https://github.com/NaokiHori/Pendulum"
publish = false
license = "MIT"

[[bin]]
name = "pendulum"
path = "src/main.rs"

[lib]
name = "pendulum"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[features]
explicit = []
