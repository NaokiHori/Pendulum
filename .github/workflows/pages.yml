name: Deploy-Pages

on:
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build artifacts
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ASSETS: assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Make directory to store all artifacts
        run: |
          mkdir ${{ env.ASSETS }}
      - name: Setup node
        uses: actions/setup-node@main
        with:
          node-version: latest
      - name: Install dependencies
        run: |
          rm package-lock.json
          npm install
      - name: Install wasm-pack
        run: |
          cargo install wasm-pack
      - name: Build rust code
        run: |
          wasm-pack build --target web --features "library-crate"
      - name: Build web application
        run: |
          tsc
          npx \
            vite build \
            --outDir=${{ env.ASSETS }} \
            --base=https://naokihori.github.io/Pendulum/
      - name: Build documentation using Sphinx
        run: |
          docker run \
            --rm \
            -v ${PWD}:/project \
            -w /project \
            sphinxdoc/sphinx:latest \
            sphinx-build docs/source ${{ env.ASSETS }}/docs
      - name: Attach thumbnail to the root
        run: |
          cp docs/source/thumbnail.jpg ${{ env.ASSETS }}/
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.ASSETS }}
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
