name: Deploy-Pages

on:
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: Scan images
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Build and scan images
        run: |
          cd web
          docker build -t web .
          cd ../scan
          mkdir -p tmp
          docker save web -o tmp/image.tar
          #
          docker build -t scan .
          docker run \
            --rm \
            -v "${PWD}/tmp":/workspace:ro \
            scan \
            image \
            --no-progress \
            --severity CRITICAL \
            --exit-code 1 \
            --input /workspace/image.tar
  build:
    name: Build artifacts
    needs: scan
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ARTIFACT_BASE: "https://naokihori.github.io/Pendulum/"
      ARTIFACT_DESTINATION: "./dist"
      ASSETS: assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Build app (Rust)
        run: |
          cd app
          make build-image
          make build
      - name: Build web (TypeScript)
        run: |
          cd web
          make build-image
          mv ../app/pendulum.wasm ./src/
          make polish
          make build
      - name: Build docs (Python)
        run: |
          cd docs
          make build-image
          make build \
            ARTIFACT_BASE=${{ env.ARTIFACT_BASE }} \
            ARTIFACT_DESTINATION=${{ env.ARTIFACT_DESTINATION }}
      - name: Pack all artifacts
        run: |
          mkdir ${{ env.ASSETS }}
          mv web/dist/* ${{ env.ASSETS }}/
          mv docs/build ${{ env.ASSETS }}/docs
          cp docs/source/thumbnail.jpg ${{ env.ASSETS }}/
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.ASSETS }}
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
