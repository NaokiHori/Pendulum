concurrency:
  cancel-in-progress: true
  group: "pages"
jobs:
  build:
    env:
      ARTIFACT_APP: "pendulum.wasm"
      ARTIFACT_DOCS: "./artifact"
      ARTIFACT_WEB: "./artifact"
      ASSETS: "assets"
    name: Build artifacts
    needs: scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.0
        with:
          persist-credentials: false
      - name: Build app (Rust)
        run: |
          cd app
          make build-image
          make build \
            ARTIFACT=${{ env.ARTIFACT_APP }}
      - name: Build web (TypeScript)
        run: |
          cd web
          make build-image
          mv ../app/${{ env.ARTIFACT_APP }} ./src/
          make polish
          make build \
            ARTIFACT=${{ env.ARTIFACT_WEB }}
      - name: Build docs (Python)
        run: |
          cd docs
          make build-image
          make build \
            ARTIFACT=${{ env.ARTIFACT_DOCS }}
      - name: Pack all artifacts
        run: |
          mkdir ${{ env.ASSETS }}
          mv web/${{ env.ARTIFACT_WEB }}/* ${{ env.ASSETS }}/
          mv docs/${{ env.ARTIFACT_DOCS }} ${{ env.ASSETS }}/docs
          cp docs/source/thumbnail.jpg ${{ env.ASSETS }}/
      - name: Upload assets
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ env.ASSETS }}
    timeout-minutes: 10
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy
    needs: build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - id: configure_pages
        name: Setup GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.0
    timeout-minutes: 5
  scan:
    name: Scan images
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.0
        with:
          persist-credentials: false
      - name: Build image for scan
        run: |
          cd ${{ matrix.image }}
          docker build -t ${{ matrix.image }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: '1'
          image-ref: ${{ matrix.image }}
          severity: 'CRITICAL'
    strategy:
      matrix:
        image:
          - app
          - docs
          - web
    timeout-minutes: 10
name: Deploy-Pages
on:
  workflow_dispatch: {}
permissions: {}
